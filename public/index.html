<!doctype html>
<html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090e18"><title>WEB TOOLS</title>
<style>
:root{color-scheme:dark;--bg:#080d16;--panel:#111a29;--line:#29384d;--muted:#9baec5;--blue:#72aaff;--green:#43d69a;--red:#ff7585;--yellow:#f3c86b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 12% 0,#172c4b 0,transparent 40%),var(--bg);color:#edf4ff;font:15px system-ui,Arial}
main{max-width:820px;margin:auto;padding:16px 12px 38px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.logo{font-weight:900;font-size:23px;letter-spacing:1px}.muted,.hint{color:var(--muted);font-size:12px}.tag{border:1px solid #35577d;border-radius:99px;padding:5px 10px;color:#b7d6ff;font-size:12px}
.panel{background:rgba(17,26,41,.96);border:1px solid var(--line);border-radius:13px;padding:13px;margin:10px 0;box-shadow:0 8px 22px #0002}h2{font-size:16px;margin:0 0 12px}
label{display:block;color:var(--muted);font-size:12px;margin:11px 0 6px}input,select,textarea{width:100%;padding:11px;background:#0a1220;color:#edf4ff;border:1px solid #344861;border-radius:9px;font:inherit}textarea{min-height:100px;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
button{padding:10px 13px;border:0;border-radius:9px;background:#347ce3;color:#fff;font-weight:750;cursor:pointer}button.alt{background:#202f44;border:1px solid #40536d}button.red{background:#562834}button:disabled{opacity:.5;cursor:not-allowed}
.key{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:9px;align-items:center;border-bottom:1px solid #29384d;padding:10px 0}.key:last-child{border-bottom:0}.keyname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pill{font-size:11px;border-radius:99px;padding:4px 8px;background:#27374d;color:#c5d7ed}.status.success{background:#123d30;color:#85edc2}.status.failed{background:#4d242e;color:#ffadb7}.status.running{background:#18395f;color:#b4d6ff}.status.queued{background:#44391c;color:#ffe0a0}
.results{display:grid;grid-template-columns:1fr;gap:10px}.api-count{display:inline-flex;align-items:center;justify-content:center;min-width:42px;padding:7px 12px;border:1px solid #40536d;border-radius:99px;background:#202f44;font-weight:800}.loader{display:flex;align-items:center;gap:11px;padding:18px 12px;border:1px solid #2a3b53;border-radius:12px;background:#0a1321}.spinner{width:20px;height:20px;border:3px solid #334a68;border-top-color:#73aaff;border-radius:50%;animation:spin .8s linear infinite;flex:none}@keyframes spin{to{transform:rotate(360deg)}}.card{background:#0a1321;border:1px solid #2a3b53;border-radius:12px;padding:12px;min-width:0}.card pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:280px;overflow:auto;font:12px/1.5 ui-monospace,monospace;color:#dce9fa}.progress{height:7px;background:#26364b;border-radius:9px;overflow:hidden;margin-top:10px}.bar{height:100%;width:0;background:#73aaff;transition:width .25s}.hide{display:none}.tool-title{font-size:25px;letter-spacing:2px}.compact{max-width:680px}.key-list{margin-top:10px}.key-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}.key-item button{padding:6px 9px}.actions button{flex:1}.warning{border-left:3px solid var(--yellow);padding:8px 10px;background:#302a1b;color:#ffe1a3;border-radius:5px;font-size:12px;margin-top:10px}
@media(max-width:650px){.grid,.results{grid-template-columns:1fr}.panel{padding:12px}.key{grid-template-columns:auto minmax(0,1fr) auto}.key .selectKey{grid-column:1}.key button{grid-column:3}.head{align-items:flex-start}}

/* Neon hacker theme */
@property --led-angle{syntax:"<angle>";inherits:false;initial-value:0deg}
:root{color-scheme:dark;--bg:#030705;--panel:#080e0b;--line:#173c28;--muted:#85a894;--blue:#38f58a;--green:#39ff88;--red:#ff596d;--yellow:#e8ff76}
body{background:radial-gradient(ellipse at 50% -15%,#0e3a23 0,transparent 48%),linear-gradient(135deg,#020403,#050a07 55%,#020403);color:#e7fff0}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.13;background-image:linear-gradient(#35ff8b12 1px,transparent 1px),linear-gradient(90deg,#35ff8b12 1px,transparent 1px);background-size:32px 32px}
.logo{color:#65ff9e;text-shadow:0 0 16px #00ff7555}.muted,.hint{color:#88aa94}.tag{border-color:#237344;color:#9bffbb;background:#07170d}
.panel{background:rgba(6,13,9,.96);border-color:#153b25;box-shadow:0 8px 24px #0009,0 0 18px #00ff7508}
h2{color:#baffcf}label{color:#91b89d}
input,select,textarea{background:#030805;color:#ddffe8;border-color:#205535;box-shadow:inset 0 0 10px #00ff7508}
input:focus,select:focus,textarea:focus{outline:1px solid #47ff8b;border-color:#47ff8b;box-shadow:0 0 0 3px #17ff6c20,0 0 16px #00ff7530}
button{background:linear-gradient(135deg,#16a34a,#20df68);color:#031108;box-shadow:0 0 14px #00ff7530;transition:transform .16s,box-shadow .16s,filter .16s}
button:hover{transform:translateY(-1px);filter:brightness(1.13);box-shadow:0 0 22px #00ff7560}
button.alt{background:#0b1a11;border:1px solid #28613c;color:#baffcc;box-shadow:none}button.alt:hover{background:#102819;box-shadow:0 0 14px #00ff7528}
.status.success{background:#07371d;color:#72ffad}.status.failed{background:#42141b;color:#ff9ca7}.status.running{background:#0b3020;color:#a3ffc3}.status.queued{background:#272e10;color:#e5f68c}
.api-count{border-color:#28613c;background:#0b1a11;color:#a8ffbf}.card{background:#040a06;border-color:#174428;box-shadow:inset 0 0 20px #00ff7505}.card pre{color:#c9f9d6}
#monitorPanel{--led-angle:0deg;position:relative;isolation:isolate;border:2px solid transparent;border-radius:15px;background:linear-gradient(#050a07,#050a07) padding-box,conic-gradient(from var(--led-angle),#36ff76,#00e5ff,#9c55ff,#ff3da7,#ffc247,#36ff76) border-box;box-shadow:0 0 10px #00ff7540,0 0 18px #00d9ff22,0 0 28px #ff38b422;animation:ledRotate 5s linear infinite}
@keyframes ledRotate{to{--led-angle:360deg}}
.progress{height:8px;background:#0d1c12;border:1px solid #1a4a2c}.bar{position:relative;background:linear-gradient(90deg,#12c94f,#7dff48,#22ffd0);box-shadow:0 0 12px #27ff78;overflow:hidden}.bar:after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 15%,#ffffffb0 50%,transparent 85%);transform:translateX(-100%);animation:barShine 1.6s linear infinite}@keyframes barShine{to{transform:translateX(100%)}}
.loading-chip{display:inline-flex;align-items:center;gap:8px;color:#9bffbc;font:11px ui-monospace,monospace;letter-spacing:.5px;text-transform:uppercase}
.spinner{width:22px;height:22px;border:2px solid #164629;border-top-color:#4dff88;border-right-color:#16e6a2;border-radius:50%;box-shadow:0 0 12px #00ff7560;animation:spin .72s linear infinite;position:relative}
.spinner:after{content:"";position:absolute;inset:4px;border:1px solid #1c7840;border-bottom-color:#b4ff49;border-radius:50%;animation:spin .95s linear infinite reverse}
.card:has(.loading-chip){border-color:#28613d;animation:cardPulse 2s ease-in-out infinite}@keyframes cardPulse{50%{box-shadow:inset 0 0 18px #00ff750c,0 0 12px #00ff751a}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}

</style></head>
<body><main>
<header class="head"><div><div class="logo tool-title">WEB TOOLS</div><div class="muted">AI browser runner</div></div><span class="tag">Cloud Browser API</span></header>

<section class="panel compact">
<div class="grid">
<div><label>Agent</label><select id="agent">
<option value="cua">OpenAI CUA</option><option value="browserUse">Browser Use</option><option value="hyperAgent">HyperAgent</option><option value="claudeComputerUse">Claude Computer Use</option><option value="geminiComputerUse">Gemini Computer Use</option><option value="metaComputerUse">Meta Computer Use</option><option value="grokComputerUse">Grok Computer Use</option><option value="jevComputerUse">Jev Computer Use</option>
</select></div>
<div><label>Model</label><select id="model">
<option value="gpt-6-astra">GPT 6 Astra</option><option value="gpt-6.1-sol">GPT 6.1 Sol</option><option value="gpt-6.1-terra">GPT 6.1 Terra</option><option value="gpt-6-sol">GPT 6 Sol</option><option value="gpt-6-luna">GPT 6 Luna</option><option value="gpt-5.6-sol">GPT 5.6 Sol</option><option value="gpt-5.6-terra">GPT 5.6 Terra</option><option value="gpt-5.6-luna">GPT 5.6 Luna</option><option value="gpt-5.5">GPT 5.5</option><option value="gpt-5.4">GPT 5.4</option><option value="gpt-5.4-mini">GPT 5.4 Mini</option><option value="gemini-2.0-flash">Gemini 2.0 Flash (Browser Use)</option><option value="custom">Custom model ID…</option>
</select><input id="customModel" class="hide" style="margin-top:7px" placeholder="Masukkan model ID yang didukung agent"></div>
</div>
<select id="reason" hidden><option>low</option><option selected>medium</option><option>high</option><option>xhigh</option><option>max</option></select><input id="steps" type="hidden" value="50">
</section>
<section class="panel" id="monitorPanel">
<div class="between"><h2 style="margin:0">Monitor</h2><span id="summary" class="tag">Belum berjalan</span></div>
<div class="progress"><div id="bar" class="bar"></div></div><div id="info" class="hint" style="margin-top:8px">Siap. Tambahkan API key untuk memulai.</div>
<div id="results" class="results" style="margin-top:12px"><div class="hint">Hasil proses akan muncul di sini.</div></div>
<div class="row" style="margin-top:10px"><button class="alt" id="copyAll">Salin semua</button><button class="alt" id="download">Unduh TXT</button><button class="alt" id="reset">Bersihkan monitor</button></div>
</section>
<section class="panel">
<label for="prompt" style="margin-top:0">Prompt</label>
<textarea id="prompt" placeholder="Tulis perintah untuk agent..."></textarea>
<div class="row actions" style="margin-top:10px"><button id="run">Kirim</button><button class="alt" id="generateKey" type="button">Generate Key</button></div>
</section>
<section class="panel" id="apiPanelAnchor">
<h2>Menu API</h2>
<div class="grid">
<div><label>Nama (opsional)</label><input id="apiName" placeholder="Misalnya: Akun utama"></div>
<div><label>API Key</label><input id="apiKey" type="password" autocomplete="off" placeholder="Tempel API key"></div>
</div>
<div class="row" style="margin-top:10px"><button id="add">+ Tambah API</button><button class="alt" id="clear">Hapus semua</button></div>
<label>Atau upload TXT — satu API key per baris</label><input id="file" type="file" accept=".txt,text/plain">
<div class="between" style="margin-top:10px"><span id="apiStorageStatus" class="hint">API key disimpan di browser ini</span><span id="apiBadge" class="api-count">0</span></div>
<p class="hint" style="margin:7px 0 0">Penyimpanan browser tidak dienkripsi. Hindari perangkat bersama; hapus key jika perangkat dipakai orang lain.</p>
<div id="keyList" class="key-list"></div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
const API_STORAGE_KEY="dhenlee.webtools.apiKeys";
function loadApiKeys(){
  try{
    const saved=JSON.parse(localStorage.getItem(API_STORAGE_KEY)||"[]");
    if(!Array.isArray(saved))return [];
    return saved.filter(x=>x&&typeof x.key==="string"&&x.key.trim()).slice(0,50).map((x,i)=>({name:typeof x.name==="string"&&x.name.trim()?x.name:`Akun API ${i+1}`,key:x.key,selected:true}));
  }catch{return [];}
}
let apiKeys=loadApiKeys(), records=[], isRunning=false;
function persistApiKeys(){
  try{
    if(apiKeys.length)localStorage.setItem(API_STORAGE_KEY,JSON.stringify(apiKeys.map(({name,key})=>({name,key}))));
    else localStorage.removeItem(API_STORAGE_KEY);
    $("apiStorageStatus").textContent="Tersimpan di browser ini";
    return true;
  }catch(error){
    $("apiStorageStatus").textContent="Gagal menyimpan ke browser";
    console.warn("Tidak dapat menyimpan API key ke localStorage",error);
    return false;
  }
}
const DEFAULT_KEY_TASK="tester web buka tab 1 https://unlimitmail.com/en/temp-mail salin email buka tab https://app.hyperbrowser.ai/signup lakukan pendaftaran pakai email unlimitmail tadi pw Akun77@@ verivikasi buka tab 1 inbok tunggu 2detik kalau g muncul inbok refresh halaman buka pesan geser ke bawah di dalam pesan sampe ada tulisan verivikasi nah klik lanjut ke pengaturan apikey buat api baru salin apikey done kasih hasil apikey dan email ke saya.";
$("generateKey").onclick=()=>{if(isRunning)return;runTasks(DEFAULT_KEY_TASK);};
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function renderKeys(){
  $("apiBadge").textContent=String(apiKeys.length);
  $("keyList").innerHTML=apiKeys.map((k,i)=>`<div class="key-item"><span>${esc(k.name)}</span><span class="hint">••••••••</span><button class="alt" data-remove-key="${i}" aria-label="Hapus ${esc(k.name)}">Hapus</button></div>`).join("")||`<div class="hint">Belum ada API key.</div>`;
}

$("add").onclick=()=>{const key=$("apiKey").value.trim();if(!key)return alert("Isi API Key dulu.");if(apiKeys.length>=50)return alert("Maksimal 50 API key.");apiKeys.push({name:$("apiName").value.trim()||`Akun API ${apiKeys.length+1}`,key,selected:true});persistApiKeys();$("apiName").value="";$("apiKey").value="";renderKeys();};
$("clear").onclick=()=>{if(isRunning)return alert("Tunggu task selesai dulu.");apiKeys=[];persistApiKeys();renderKeys();};
$("keyList").onclick=e=>{const b=e.target.closest("[data-remove-key]");if(!b||isRunning)return;apiKeys.splice(Number(b.dataset.removeKey),1);persistApiKeys();renderKeys();};
$("file").onchange=async e=>{const f=e.target.files?.[0];if(!f)return;const lines=(await f.text()).split(/\r?\n/).map(s=>s.trim()).filter(s=>s&&!s.startsWith("#"));for(const key of lines){if(apiKeys.length>=50)break;apiKeys.push({name:`Imported ${apiKeys.length+1}`,key,selected:true});}persistApiKeys();renderKeys();e.target.value="";};
$("agent").onchange=()=>{const isCua=$("agent").value==="cua";$("reason").disabled=!isCua;if(isCua){$("model").value="gpt-6-astra";}else if($("agent").value==="browserUse"){$("model").value="gemini-2.0-flash";}else{$("model").value="custom";$("customModel").classList.remove("hide");}};
$("model").onchange=()=>{$("customModel").classList.toggle("hide",$("model").value!=="custom");};
function getModel(){return $("model").value==="custom"?$("customModel").value.trim():$("model").value;}
function statusClass(s){return ["success","failed","running","queued"].includes(s)?s:"queued";}
function cleanText(value){return String(value??"").replace(/\bHyperbrowser\b[:：]?\s*/gi,"").replace(/\n{3,}/g,"\n\n").trim();}
function render(){
  const finished=records.filter(r=>["success","failed"].includes(r.status)).length;
  const ok=records.filter(r=>r.status==="success").length, bad=records.filter(r=>r.status==="failed").length;
  $("summary").textContent=`${ok} sukses · ${bad} gagal · ${records.length-finished} proses`;
  $("bar").style.width=(records.length?finished/records.length*100:0)+"%";
  $("results").innerHTML=records.map(r=>`<div class="card"><div class="between"><strong>${esc(r.name)}</strong><span class="row"><span class="pill status ${statusClass(r.status)}">${esc(r.status.toUpperCase())}</span>${["queued","running"].includes(r.status)?`<span class="loading-chip"><i class="spinner"></i>${r.status==="queued"?"Menunggu":"Running"}</span>`:""}</span></div><div class="hint">${esc(r.finishedAt||r.startedAt||"")}</div><pre>${esc(cleanText(r.output||r.error||"Tidak ada detail hasil dari server."))}</pre><div class="row"><button class="alt" data-copy="${r.id}">Salin hasil</button>${r.liveUrl?`<a target="_blank" rel="noopener" href="${esc(r.liveUrl)}" class="hint">Live View</a>`:""}</div></div>`).join("")||`<div class="hint">Belum ada hasil.</div>`;
}
$("results").onclick=e=>{const b=e.target.closest("[data-copy]");if(!b)return;const r=records.find(x=>x.id===b.dataset.copy);if(r)navigator.clipboard.writeText(`${r.name} — ${r.status.toUpperCase()}\n${cleanText(r.output||r.error||"")}`);};
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function post(path,data){const response=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});let body={};try{body=await response.json();}catch{}if(!response.ok)throw new Error(body.error||`HTTP ${response.status}`);return body;}
async function runOne(rec,task,agent,llm,reasoningEffort,maxSteps){
  try{
    const started=await post("/api/start",{apiKey:rec.key,task,agent,llm,reasoningEffort,maxSteps});
    rec.jobId=started.jobId;rec.liveUrl=started.liveUrl;rec.startedAt=new Date().toLocaleTimeString();rec.status="running";rec.output="Job berjalan; menunggu hasil dari server…";render();
    let tries=0;
    while(tries++<180){
      await sleep(3500);
      try{
        const check=await post("/api/status",{apiKey:rec.key,agent,jobId:rec.jobId});
        if(check.terminal){rec.status=check.status;rec.output=check.output||"";rec.error=check.error||"";rec.steps=check.steps;rec.finishedAt=check.finishedAt;render();return;}
        rec.status="running";rec.progress=check.status||"running";rec.output=`Status server: ${rec.progress}. Job ID: ${rec.jobId}`;render();
      }catch(err){rec.pollError=err.message;rec.output=`Menunggu status server… (${err.message})`;render();await sleep(2500);}
    }
    rec.status="failed";rec.error="Polling berhenti setelah 10 menit. Periksa status job pada dashboard penyedia.";render();
  }catch(err){rec.status="failed";rec.error=err.message;render();}
}
async function runTasks(task=$("prompt").value.trim()){
  if(isRunning)return;
  if(!task)return alert("Tulis prompt dulu.");
  const selected=apiKeys;const count=selected.length;
  if(!count)return alert("Tambahkan API key dulu.");
  const agent=$("agent").value,llm=getModel(),maxSteps=Number($("steps").value);
  if(!llm)return alert("Pilih/isi model ID.");if(!Number.isInteger(maxSteps)||maxSteps<1||maxSteps>100)return alert("Max steps harus 1–100.");
  const chosen=selected.slice();
  records=chosen.map((k,i)=>({id:`${Date.now()}-${i}`,name:k.name,key:k.key,status:"queued",output:"Menunggu giliran...",startedAt:""}));
  isRunning=true;$("run").disabled=true;$("generateKey").disabled=true;$("info").textContent=`Mengirim ke ${count} API…`;$("summary").textContent="Sedang berjalan";$("bar").style.width="0%";render();
  // Keep a small concurrency window so a large key list does not immediately overwhelm the account.
  let cursor=0;const workers=Array.from({length:Math.min(4,records.length)},async()=>{while(cursor<records.length){const i=cursor++;await runOne(records[i],task,agent,llm,$("reason").value,maxSteps);}});
  await Promise.all(workers);isRunning=false;$("run").disabled=false;$("generateKey").disabled=false;$("info").textContent="Semua proses selesai.";render();
}
$("run").onclick=()=>runTasks();
$("reset").onclick=()=>{if(isRunning)return alert("Task masih berjalan. Tunggu sampai selesai.");records=[];$("summary").textContent="Belum berjalan";$("bar").style.width="0";$("info").textContent="Monitor dibersihkan.";render();};
function allText(){return records.map(r=>`${r.name} | ${r.status.toUpperCase()}${r.jobId?" | Job: "+r.jobId:""}\n${cleanText(r.output||r.error||"")}`).join("\n\n==============================\n\n");}
$("copyAll").onclick=()=>{if(!records.length)return alert("Belum ada hasil.");navigator.clipboard.writeText(allText());};
$("download").onclick=()=>{if(!records.length)return alert("Belum ada hasil.");const blob=new Blob([allText()],{type:"text/plain;charset=utf-8"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="dhenlee-ai-results.txt";a.click();URL.revokeObjectURL(url);};
renderKeys();render();
</script></body></html>
